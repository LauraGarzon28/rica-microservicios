server:
  port: 8081

spring:
  grpc:
    client:
      channel:
        investigadores:
          target: static://localhost:9090
  application:
    name: publicaciones-service
  mongodb:
    uri: mongodb://localhost:27017/rica
  
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka